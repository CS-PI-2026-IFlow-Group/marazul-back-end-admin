spring.application.name=marazul-back-end-admin
spring.config.import=optional:classpath:application-secrets.properties

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.deserialization.fail-on-unknown-properties=true

# URL base do front-end usada no link de recuperação de senha enviado por e-mail
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:5173}

#URL base do front-end (Levando em conta que é React então porta é 5173)
app.password-define.base-url=${PASSWORD_DEFINE_BASE_URL:http://localhost:5173}

# Origens do front-end liberadas no CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
