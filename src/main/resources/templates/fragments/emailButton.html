<!DOCTYPE html>
<!--
  Botão da ação principal, com o mesmo link em texto logo abaixo
  para clientes que bloqueiam estilo ou não deixam clicar no botão.
  Uso: th:replace="~{fragments/emailButton :: button(${link}, 'Rótulo')}"
  bgcolor, cellpadding e align são obsoletos, mas necessários em clientes de e-mail (ver emailLayout).
-->
<!--suppress HtmlDeprecatedAttribute -->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<th:block th:fragment="button(link, label)">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
        <tr>
            <td align="center" bgcolor="#000000" style="background-color:#000000; border-radius:6px;">
                <a th:href="${link}" th:text="${label}" target="_blank"
                   style="display:inline-block; padding:14px 28px; font-family:Arial, Helvetica, sans-serif;
                          font-size:16px; font-weight:bold; color:#ffffff; text-decoration:none;
                          border-radius:6px;">Ação</a>
            </td>
        </tr>
    </table>
    <p style="margin:0 0 4px 0; font-size:13px; line-height:20px; color:#666666;">
        Se o botão não funcionar, copie e cole este endereço no navegador:
    </p>
    <p style="margin:0 0 24px 0; font-size:13px; line-height:20px; word-break:break-all;">
        <a th:href="${link}" th:text="${link}" target="_blank" style="color:#000000;">link</a>
    </p>
</th:block>
</body>
</html>
