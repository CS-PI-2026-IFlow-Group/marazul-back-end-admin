<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/emailLayout :: layout(~{::title}, ~{::content})}" lang="pt-BR">
<head>
    <title>Defina sua senha - Marazul Turismo</title>
</head>
<body>
<th:block th:fragment="content">
    <h1 style="margin:0 0 16px 0; font-size:22px; line-height:28px; color:#000000;">Bem-vindo(a) à Marazul Turismo</h1>
    <p style="margin:0 0 16px 0;">Olá, <strong th:text="${name}">colaborador</strong>.</p>
    <p style="margin:0 0 16px 0;">
        Seu cadastro no sistema administrativo da Marazul Turismo foi criado.
        Para acessar, defina sua senha pelo botão abaixo.
    </p>
    <th:block th:replace="~{fragments/emailButton :: button(${link}, 'Definir minha senha')}"></th:block>
    <p style="margin:0; font-size:14px; line-height:20px; color:#555555;">
        Este link é válido por <strong th:text="|${expirationMinutes} minutos|">15 minutos</strong>.
        Depois disso, peça ao administrador do sistema um novo envio.
    </p>
</th:block>
</body>
</html>
