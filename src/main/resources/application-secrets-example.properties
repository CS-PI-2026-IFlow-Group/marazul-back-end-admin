# Copie este arquivo para application-secrets.properties e preencha com suas credenciais locais.
# O arquivo application-secrets.properties esta no .gitignore e nunca deve ser commitado.

# Banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/marazul_admin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=SEU_USUARIO
spring.datasource.password=SUA_SENHA
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT - nunca exponha este valor. Gere uma chave segura para producao.
api.security.token.secret=SUA_CHAVE_BASE64_AQUI

# E-mail SMTP (Gmail)
# Para usar com Gmail, gere uma Senha de App em: myaccount.google.com/security
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=SEU_EMAIL@gmail.com
spring.mail.password=SUA_SENHA_DE_APP_GMAIL
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
